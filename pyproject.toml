[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-trajectory-evidence"
version = "0.1.0"
description = "Privacy-bounded, content-addressed evidence tooling for Open Trajectory"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]

[project.scripts]
ot-evidence = "open_trajectory_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
